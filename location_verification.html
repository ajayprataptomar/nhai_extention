<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NHAI RAMS - Location Verification System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="lib/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="lib/vendor/leaflet/markercluster.css" />
  <link rel="stylesheet" href="lib/vendor/leaflet/markercluster-default.css" />
  <link rel="stylesheet" href="location_verification.css" />

  <script src="lib/vendor/leaflet/leaflet.js"></script>
  <script src="lib/vendor/leaflet/markercluster.js"></script>
</head>
<body>
  <div id="header-bar">
    <div class="brand-section">
      <img src="icons/nhai-official-logo.png" alt="NHAI Logo" style="height: 28px; width: auto; object-fit: contain; margin-right: 4px;">
      <div class="brand-title">NHAI Road Asset Verification & Location Analysis</div>
    </div>
    <div class="header-actions">
      <button class="btn-popout" id="btn-popout">
        <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
        Popout Full Window
      </button>
    </div>
  </div>

  <div id="summary-bar">
    <div class="metric-group">
      <span class="pill pill-highlight">Sampled Records: <span id="sum-total">0</span></span>
      <span class="pill">MCW: <span id="sum-mcw">0</span></span>
      <span class="pill">SR: <span id="sum-sr">0</span></span>
      <span class="pill">IR: <span id="sum-ir">0</span></span>
    </div>
    <div class="metric-group">
      <span class="pill">LHS: <span id="sum-lhs">0</span></span>
      <span class="pill">RHS: <span id="sum-rhs">0</span></span>
      <span class="pill">High Severity: <span id="sum-high">0</span></span>
    </div>
    <div class="metric-group">
      <span class="pill"><span class="dot dot-normal"></span> Normal: <span id="sum-normal">0</span></span>
      <span class="pill"><span class="dot dot-review"></span> Review: <span id="sum-review">0</span></span>
      <span class="pill"><span class="dot dot-suspicious"></span> Flagged: <span id="sum-suspicious">0</span></span>
    </div>
  </div>

  <div id="main-container">
    <div id="sidebar">
      <div class="filter-item">
        <label class="filter-label">Search Record</label>
        <input type="text" id="filter-search" class="input-control" placeholder="Search S.No or Defect ID...">
      </div>
      <div class="filter-item">
        <label class="filter-label">Defect Type</label>
        <select id="filter-type" class="input-control"><option value="ALL">All Categories</option></select>
      </div>
      <div class="filter-item">
        <label class="filter-label">Road Classification</label>
        <select id="filter-road" class="input-control">
          <option value="ALL">All Alignments</option>
          <option value="MCW">MCW (Main Carriageway)</option>
          <option value="SR">SR (Service Road)</option>
          <option value="IR">IR (Interchange / Ramp)</option>
        </select>
      </div>
      <div class="filter-item">
        <label class="filter-label">Carriageway Side</label>
        <select id="filter-direction" class="input-control">
          <option value="ALL">Both Sides (LHS & RHS)</option>
          <option value="LHS">LHS (Left Hand Side)</option>
          <option value="RHS">RHS (Right Hand Side)</option>
        </select>
      </div>
      <div class="filter-item">
        <label class="filter-label">Defect Severity</label>
        <select id="filter-severity" class="input-control">
          <option value="ALL">All Severities</option>
          <option value="HIGH">High Severity</option>
          <option value="MED">Medium Severity</option>
          <option value="LOW">Low Severity</option>
        </select>
      </div>
      <div class="filter-item">
        <label class="filter-label">Anomaly Status</label>
        <select id="filter-suspicion" class="input-control">
          <option value="ALL">All Statuses</option>
          <option value="Normal">Normal Geometry</option>
          <option value="Review">Review Required</option>
          <option value="Suspicious">Flagged Outlier</option>
        </select>
      </div>

      <div class="controls-panel">
        <div class="filter-label">Inspection Modes</div>
        <div class="btn-toggle-group">
          <button id="btn-cluster-toggle" class="btn-toggle active">Cluster: ON</button>
          <button id="btn-density-toggle" class="btn-toggle">Halo: OFF</button>
        </div>
        <div class="btn-toggle-group">
          <button id="btn-fit-selected" class="btn-toggle">Fit Selected</button>
          <button id="btn-reset-view" class="btn-toggle">Reset View</button>
        </div>
        <button id="btn-progression-toggle" class="btn-toggle" style="width:100%;">Progression Path: OFF</button>
      </div>
    </div>

    <div id="map-wrapper">
      <div id="global-toast">✓ Location Decision Saved to Sheet</div>
      <div id="loading"><div class="spinner"></div><span style="font-size:12px; font-weight:600; color:#475569;">Initializing High-Precision Geographic Engine...</span></div>
      <div id="map"></div>
    </div>
  </div>

  <script src="lib/clusterApi.js"></script>
  <script src="lib/auth.js"></script>
  <script src="lib/utils.js"></script>
  <script src="lib/sheetsApi.js"></script>
  <script src="lib/locationEngine.js"></script>
  <script src="location_verification.js"></script>
</body>
</html>
